<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026年4月新能源行业新闻汇总</title>
  <style>
    :root {
      --blue: #002fa7;
      --blue-weak: #edf3ff;
      --ink: #151b2b;
      --text: #2d3748;
      --muted: #687383;
      --line: #dce2ed;
      --paper: #ffffff;
      --ground: #f5f7fb;
      --green: #0d7d6b;
      --gold: #a87616;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--text);
      background: var(--ground);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      line-height: 1.78;
    }

    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { font: inherit; }

    .progress {
      position: fixed;
      z-index: 50;
      top: 0;
      left: 0;
      width: 0;
      height: 3px;
      background: var(--blue);
    }

    .shell {
      max-width: 820px;
      margin: 0 auto;
      background: var(--paper);
      min-height: 100vh;
      box-shadow: 0 0 0 1px rgba(18, 29, 51, .04);
    }

    header {
      padding: 32px 20px 22px;
      border-top: 6px solid var(--blue);
      border-bottom: 1px solid var(--line);
      background: var(--paper);
    }

    .eyebrow {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
      color: var(--blue);
      font-size: 14px;
      font-weight: 700;
    }

    .eyebrow::before {
      content: "";
      width: 28px;
      height: 2px;
      background: var(--blue);
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, serif;
      font-size: clamp(32px, 9vw, 54px);
      line-height: 1.16;
      letter-spacing: 0;
      font-weight: 800;
    }

    .deck {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .dateline {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .nav {
      position: sticky;
      z-index: 40;
      top: 3px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 9px 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(10px);
      scrollbar-width: none;
    }

    .nav::-webkit-scrollbar { display: none; }

    .nav a {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: var(--paper);
      font-size: 13px;
      line-height: 1.4;
    }

    .nav a.active {
      border-color: var(--blue);
      color: var(--blue);
      background: var(--blue-weak);
      text-decoration: none;
    }

    main { padding: 0 16px 40px; }

    section {
      padding: 34px 0 2px;
      scroll-margin-top: 62px;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--blue);
    }

    h2 {
      margin: 0;
      color: var(--ink);
      font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, serif;
      font-size: 23px;
      line-height: 1.28;
      letter-spacing: 0;
    }

    .section-num {
      color: var(--blue);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .story {
      padding: 18px 0 20px;
      border-bottom: 1px solid var(--line);
    }

    .story:last-child { border-bottom: 0; }

    .story-media {
      margin: 0 0 14px;
      border-radius: 6px;
      overflow: hidden;
      background: #eef1f6;
    }

    .story-media img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      object-fit: cover;
    }

    .story-media figcaption {
      padding: 8px 10px;
      color: var(--muted);
      background: #f8f9fc;
      border-top: 1px solid var(--line);
      font-size: 12px;
      line-height: 1.5;
    }

    .story h3 {
      margin: 0 0 8px;
      color: var(--ink);
      font-size: 20px;
      line-height: 1.42;
      letter-spacing: 0;
    }

    .date {
      display: inline-flex;
      margin-bottom: 10px;
      padding: 3px 8px;
      border-left: 3px solid var(--blue);
      color: var(--muted);
      background: var(--blue-weak);
      font-size: 13px;
      line-height: 1.5;
    }

    .story p {
      margin: 0;
      color: var(--text);
      font-size: 16px;
    }

    .source {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      word-break: break-word;
    }

    .source a { font-weight: 700; }

    .more {
      display: inline-flex;
      align-items: center;
      margin-top: 12px;
      padding: 0;
      border: 0;
      color: var(--blue);
      background: transparent;
      font-weight: 700;
      cursor: pointer;
    }

    .story.collapsed .story-text {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .market-panel {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }

    .market-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 10px;
      border-bottom: 1px solid var(--line);
      scrollbar-width: none;
    }

    .market-tabs::-webkit-scrollbar { display: none; }

    .market-tabs button {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: #fff;
      cursor: pointer;
      font-size: 13px;
    }

    .market-tabs button.active {
      border-color: var(--blue);
      color: #fff;
      background: var(--blue);
    }

    .market-body {
      padding: 14px;
    }

    .chart-title {
      margin: 0 0 4px;
      color: var(--ink);
      font-size: 18px;
      line-height: 1.35;
    }

    .chart-desc {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 84px 1fr 82px;
      align-items: center;
      gap: 10px;
      margin: 12px 0;
      font-size: 13px;
    }

    .bar-label { color: var(--ink); }
    .bar-value { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

    .bar-track {
      position: relative;
      height: 12px;
      border-radius: 999px;
      background: #e9edf5;
      overflow: hidden;
    }

    .bar-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), #2b64d8);
      transition: width 900ms cubic-bezier(.2,.75,.2,1);
    }

    .market-panel.in-view .bar-fill { width: var(--w); }

    .ring-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .ring {
      min-height: 138px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcff;
    }

    .ring svg { display: block; width: 86px; height: 86px; margin: 0 auto 8px; }
    .ring .track { fill: none; stroke: #e6ebf4; stroke-width: 10; }
    .ring .meter {
      fill: none;
      stroke: var(--blue);
      stroke-width: 10;
      stroke-linecap: round;
      stroke-dasharray: 251;
      stroke-dashoffset: 251;
      transform: rotate(-90deg);
      transform-origin: center;
      transition: stroke-dashoffset 900ms cubic-bezier(.2,.75,.2,1);
    }
    .market-panel.in-view .ring .meter { stroke-dashoffset: var(--offset); }
    .ring b { display: block; color: var(--ink); text-align: center; font-size: 17px; }
    .ring span { display: block; color: var(--muted); text-align: center; font-size: 12px; }

    .timeline {
      margin-top: 18px;
      padding-left: 18px;
      border-left: 2px solid var(--line);
    }

    .timeline-item {
      position: relative;
      padding: 0 0 18px 14px;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      left: -25px;
      top: 7px;
      width: 10px;
      height: 10px;
      border: 2px solid var(--blue);
      border-radius: 50%;
      background: #fff;
    }

    .timeline-item b { color: var(--blue); }
    .timeline-item span { display: block; color: var(--ink); font-size: 14px; line-height: 1.55; }

    .to-top {
      position: fixed;
      right: 14px;
      bottom: 18px;
      z-index: 45;
      display: none;
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--blue);
      background: rgba(255,255,255,.96);
      box-shadow: 0 8px 24px rgba(0, 47, 167, .12);
      cursor: pointer;
      font-weight: 800;
    }

    .to-top.show { display: block; }

    @media (min-width: 760px) {
      header { padding: 44px 34px 30px; }
      main { padding: 0 34px 54px; }
      .story { padding: 24px 0 26px; }
      .story.has-image {
        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 22px;
        align-items: start;
      }
      .story.has-image .story-media { margin: 0; }
      .story h3 { font-size: 21px; }
      .market-body { padding: 20px; }
    }

    @media (max-width: 520px) {
      .bar-row {
        grid-template-columns: 74px 1fr;
      }
      .bar-value {
        grid-column: 2;
        text-align: left;
        margin-top: -6px;
      }
      .ring-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <div class="shell">

      <section id="tech" data-section="技术发展突破与创新">
        <div class="section-head"><h2>三.技术发展突破与创新</h2><span class="section-num">03</span></div>

      <section id="impact" data-section="社会与环境影响">

    </main>

  </div>

    function createStory(story, index) {
      const article = document.createElement("article");
      article.className = `story collapsed${story.image ? " has-image" : ""}`;
      const image = story.image ? `
        <figure class="story-media">
          <img src="${story.image}" alt="${story.title}" loading="lazy" onerror="this.closest('.story-media').remove(); this.closest('.story')?.classList.remove('has-image');">
          <figcaption>${story.caption || "原图来源：原文页面"}</figcaption>
        </figure>` : "";
      const extra = story.extraUrl ? `<br><a href="${story.extraUrl}" target="_blank" rel="noopener">补充来源</a>` : "";
      article.innerHTML = `
        ${image}
        <div class="story-content">
          <h3>${index}.${story.title}</h3>
          <div class="date">新闻日期：${story.date}</div>
          <p class="story-text">${story.text}</p>
          <button class="more" type="button">展开全文</button>
          <div class="source">来源：${story.source}<br><a href="${story.url}" target="_blank" rel="noopener">${story.url}</a>${extra}</div>
        </div>`;
      const btn = article.querySelector(".more");
      btn.addEventListener("click", () => {
        article.classList.toggle("collapsed");
        btn.textContent = article.classList.contains("collapsed") ? "展开全文" : "收起";
      });
      return article;
    }

    function renderStories() {
      const counters = {};
      stories.forEach(story => {
        counters[story.section] = (counters[story.section] || 0) + 1;
        document.getElementById(story.section).appendChild(createStory(story, counters[story.section]));
      });
    }

    function formatNumber(value) {
      return Number.isInteger(value) ? String(value) : value.toFixed(2).replace(/0$/, "").replace(/\.0$/, "");
    }

    function renderBars(chart) {
      const max = Math.max(...chart.items.map(item => item[1]));
      return chart.items.map(([label, value]) => {
        const width = `${Math.max(1, value / max * 100)}%`;
        return `
          <div class="bar-row">
            <div class="bar-label">${label}</div>
            <div class="bar-track"><span class="bar-fill" style="--w:${width}"></span></div>
            <div class="bar-value">${formatNumber(value)}${chart.unit}</div>
          </div>`;
      }).join("");
    }

    function renderRings(chart) {
      return `<div class="ring-grid">${chart.rings.map(([label, value, percent]) => {
        const offset = 251 - 251 * percent / 100;
        return `
          <div class="ring">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <circle class="track" cx="50" cy="50" r="40"></circle>
              <circle class="meter" cx="50" cy="50" r="40" style="--offset:${offset}"></circle>
            </svg>
            <b>${value}</b>
            <span>${label}</span>
          </div>`;
      }).join("")}</div>`;
    }

    function setChart(key) {
      const chart = charts[key];
      document.getElementById("chartTitle").textContent = chart.title;
      document.getElementById("chartDesc").textContent = chart.desc;
      document.getElementById("chartBody").innerHTML = chart.items ? renderBars(chart) : renderRings(chart);
      document.querySelectorAll(".market-tabs button").forEach(button => {
        button.classList.toggle("active", button.dataset.chart === key);
      });
      requestAnimationFrame(() => document.getElementById("marketPanel").classList.add("in-view"));
    }

    function initObservers() {
      const panel = document.getElementById("marketPanel");
      const panelObserver = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) panel.classList.add("in-view");
        });
      }, { threshold: .2 });
      panelObserver.observe(panel);

      const links = Array.from(document.querySelectorAll(".nav a"));
      const sections = links.map(link => document.querySelector(link.getAttribute("href")));
      window.addEventListener("scroll", () => {
        const max = document.documentElement.scrollHeight - window.innerHeight;
        document.getElementById("progress").style.width = `${max > 0 ? window.scrollY / max * 100 : 0}%`;
        document.getElementById("toTop").classList.toggle("show", window.scrollY > 500);
        let active = sections[0];
        sections.forEach(section => {
          if (section.getBoundingClientRect().top <= 78) active = section;
        });
        links.forEach(link => link.classList.toggle("active", active && link.getAttribute("href") === `#${active.id}`));
      }, { passive: true });
    }

    renderStories();
    setChart("capacity");
    document.querySelectorAll(".market-tabs button").forEach(button => {
      button.addEventListener("click", () => {
        document.getElementById("marketPanel").classList.remove("in-view");
        setChart(button.dataset.chart);
      });
    });
    document.getElementById("toTop").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
    initObservers();
  </script>
